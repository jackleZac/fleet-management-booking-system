services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: journeygo_app
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./.env.docker:/var/www/.env
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    container_name: journeygo_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    container_name: journeygo_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: journeygo
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: journeygo_phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - mysql

volumes:
  mysql_data: